<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Sabor & Brasa</title>
  <link rel="preconnect" href="https://accounts.google.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="logo">SABOR <span>& BRASA</span> <span style="font-size:0.7em; opacity:0.9;">ADMIN</span></a>
      <nav>
        <ul class="nav-links">
          <li><a href="/index.html">Ver Cardápio</a></li>
        </ul>
      </nav>
      <div style="display:flex; align-items:center; gap:10px;">
        <div id="auth-area" class="auth-area">
          <button class="btn-login" id="btn-login"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09A6.97 6.97 0 0 1 5.48 12c0-.72.13-1.42.36-2.09V7.07H2.18A10.98 10.98 0 0 0 1 12c0 1.78.42 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg><span>Entrar</span></button>
          <div id="user-menu" class="user-menu hidden">
            <button class="user-trigger" id="user-trigger"><img id="user-avatar" src="" alt="" class="user-avatar hidden"><span id="user-initial" class="user-initial"></span><span id="user-name"></span><span class="user-chevron">▾</span></button>
            <div class="user-dropdown" id="user-dropdown"><div class="user-dropdown-header"><strong id="dropdown-name"></strong><span id="dropdown-email"></span><span id="dropdown-role" style="font-size:0.7rem; color:#27ae60; font-weight:700;"></span></div><button class="dropdown-item" id="btn-logout">Sair</button></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container" style="padding:100px 20px 40px; max-width:1100px;">
    <div id="admin-guard" style="text-align:center; padding:60px 20px; background:#1e1e1e; border:1.5px solid #2a2a2a; border-radius:16px;">
      <h2 style="font-family:'Playfair Display',serif; color:#ff6b35;">Área Admin</h2>
      <p style="color:#9a9a9a; margin-top:8px;">Faça login com Google autorizado para editar o cardápio</p>
      <div id="g_id_signin" style="display:flex; justify-content:center; margin:20px 0;"></div>
      <p id="guard-msg" style="color:#ff6b35; font-weight:600; margin-top:12px;"></p>
    </div>

    <div id="admin-panel" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:20px;">
        <h2 class="section-title" style="margin:0; text-align:left;">Gerenciar Cardápio</h2>
        <span id="admin-badge" style="background:#27ae60; color:#fff; padding:6px 12px; border-radius:999px; font-size:0.8rem; font-weight:700;">Admin</span>
      </div>

      <!-- Form -->
      <form id="prato-form" novalidate style="background:#1e1e1e; padding:20px; border-radius:16px; border:1.5px solid #2a2a2a; margin-bottom:24px;">
        <h3 id="form-title" style="margin-bottom:12px; color:#ff6b35;">Novo prato</h3>
        <input type="hidden" id="f-id-original">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
          <div class="form-group"><label style="color:#f0f0f0;">ID (slug)</label><input id="f-id" placeholder="x-burger-novo" required><small style="color:#9a9a9a;">único, sem espaços</small></div>
          <div class="form-group"><label>Categoria</label><select id="f-categoria"><option value="lanche">Lanche</option><option value="principal">Prato Principal</option><option value="entrada">Entrada</option><option value="bebida">Bebida</option><option value="sobremesa">Sobremesa</option></select></div>
          <div class="form-group"><label>Nome</label><input id="f-nome" required></div>
          <div class="form-group"><label>Preço</label><input id="f-preco" type="number" step="0.01" placeholder="32.90" required></div>
          <div class="form-group"><label>Preço Antigo (opcional)</label><input id="f-precoAntigo" type="number" step="0.01"></div>
          <div class="form-group"><label>Imagem URL</label><input id="f-imagem" placeholder="https://picsum.photos/seed/..."></div>
          <div class="form-group" style="grid-column:1/-1;"><label>Descrição</label><textarea id="f-desc" rows="2" required></textarea></div>
          <div class="form-group"><label>Badge tipo</label><select id="f-badge-tipo"><option value="">Sem badge</option><option value="promocao">Promoção</option><option value="mais-pedido">Mais pedido</option><option value="new">Novo</option></select></div>
          <div class="form-group"><label>Badge label</label><input id="f-badge-label" placeholder="ex: -15% ou Novo"></div>
        </div>
        <div style="display:flex; gap:10px; margin-top:16px;">
          <button type="submit" class="btn-enviar" style="margin:0; flex:1;">Salvar prato</button>
          <button type="button" id="btn-cancel" class="btn-clear" style="margin:0; width:auto; padding:0 20px;">Cancelar</button>
        </div>
        <p id="form-msg" style="margin-top:10px; font-size:0.85rem;"></p>
      </form>

      <!-- Lista -->
      <div id="pratos-lista" style="display:grid; gap:12px;"></div>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script type="module" src="src/admin.ts"></script>
</body>
</html>
